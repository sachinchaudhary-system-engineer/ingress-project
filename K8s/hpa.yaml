apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: demo-hpa
  namespace: jenkins

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: images-deployment

  minReplicas: 1
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 5
