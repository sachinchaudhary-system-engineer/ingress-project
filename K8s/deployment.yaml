apiVersion: apps/v1
kind: Deployment

metadata:
  name: images-deployment
  namespace: jenkins

spec:
  replicas: 1

  selector:
    matchLabels:
      app: images-app

  template:
    metadata:
      labels:
        app: images-app

    spec:
      containers:
        - name: images-container
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
